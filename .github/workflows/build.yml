name: edgestream-webui

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

on:
  push:
    branches: ['**']
    tags: ['**']

permissions:
  contents: read

jobs:
  build:
    runs-on: arc-debian-4cpu
    container:
      image: debian:trixie-slim
      options: --init

    env:
      DEBIAN_FRONTEND: noninteractive
      DEBEMAIL: "Hyperi <edgestream-support@hyperi.io>"
      DEBFULLNAME: "Hyperi"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # --- Setup the environment
      - name: Setup Build Environment
        uses: hyperi-io/edgestream-shared-workflows/setup-deps@fa6f9ffa084d2534d3c4cb24a1dbb7363d4d4403

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          check-latest: true

      - name: Install and expose pnpm to debuild
        run: |
          set -eu
          # Install pnpm directly via npm (bypassing corepack completely)
          npm install -g pnpm

          # Ensure node + pnpm are available at stable locations for debuild/dh
          ln -sf "$(command -v node)" /usr/bin/node
          ln -sf "$(command -v pnpm)" /usr/bin/pnpm

          pnpm -v

      # --- Check if the CI is healthy
      - name: Lint Workflow
        uses: hyperi-io/edgestream-shared-workflows/workflow-lint@fa6f9ffa084d2534d3c4cb24a1dbb7363d4d4403

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      # --- Security Scans (Pre-Build) ---
      - name: Security - Gitleaks
        uses: hyperi-io/edgestream-shared-workflows/gitleaks-scan@fa6f9ffa084d2534d3c4cb24a1dbb7363d4d4403
        env:
          GIT_READY: "true"
          GIT_DIR: ${{ github.workspace }}/.git
          GIT_WORK_TREE: ${{ github.workspace }}

      - name: Security - Semgrep SAST
        uses: hyperi-io/edgestream-shared-workflows/code-scan@fa6f9ffa084d2534d3c4cb24a1dbb7363d4d4403

      - name: Prepare Build Workspace
        uses: hyperi-io/edgestream-shared-workflows/prepare-env@fa6f9ffa084d2534d3c4cb24a1dbb7363d4d4403

      - name: Build Debian package
        uses: hyperi-io/edgestream-shared-workflows/build-deb@fa6f9ffa084d2534d3c4cb24a1dbb7363d4d4403
        env:
          NODE_PATH: /usr/bin/node
          PNPM_PATH: /usr/bin/pnpm

      # --- Security Scans (Post-Build) ---
      - name: Security - Trivy (Package Scan)
        uses: hyperi-io/edgestream-shared-workflows/trivy-scan@fa6f9ffa084d2534d3c4cb24a1dbb7363d4d4403
        with:
          scan-path: './dist'

      - name: Deploy Package
        if: success()
        uses: hyperi-io/edgestream-shared-workflows/deploy-deb@fa6f9ffa084d2534d3c4cb24a1dbb7363d4d4403
        with:
          ssh-key: ${{ secrets.EDGESTREAM_REPO_SSH_KEY }}
          known-hosts: ${{ secrets.EDGESTREAM_KNOWN_HOSTS }}
          repo-user: ${{ vars.EDGESTREAM_REPO_USER }}
          repo-host: ${{ vars.EDGESTREAM_REPO_HOST }}
          incoming-path: ${{ vars.EDGESTREAM_REPO_INCOMING_PATH }}
          update-script: ${{ vars.EDGESTREAM_REPO_UPDATE_SCRIPT }}
          sync-script: ''

      - name: Sync to R2
        if: success()
        uses: hyperi-io/edgestream-shared-workflows/sync-repo-r2@fa6f9ffa084d2534d3c4cb24a1dbb7363d4d4403
        with:
          ssh-key: ${{ secrets.EDGESTREAM_REPO_SSH_KEY }}
          known-hosts: ${{ secrets.EDGESTREAM_KNOWN_HOSTS }}
          repo-user: ${{ vars.EDGESTREAM_REPO_USER }}
          repo-host: ${{ vars.EDGESTREAM_REPO_HOST }}
          sync-script: ${{ vars.EDGESTREAM_REPO_SYNC_SCRIPT }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-endpoint-url: ${{ secrets.R2_ENDPOINT_URL }}

      - name: Publish GitHub Release
        if: success()
        uses: hyperi-io/edgestream-shared-workflows/release-deb@fa6f9ffa084d2534d3c4cb24a1dbb7363d4d4403
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          package-path: 'dist/*.deb'
