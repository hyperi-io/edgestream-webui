<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="EdgeStream Hub logo">
  <defs>
    <pattern id="binText" patternUnits="userSpaceOnUse" width="160" height="120">
      <text x="0" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="44" fill="#FFFFFF" opacity="0.18" letter-spacing="6">01001101011001</text>
      <text x="16" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="44" fill="#FFFFFF" opacity="0.18" letter-spacing="6">10100110100110</text>
    </pattern>
    <clipPath id="clipBox">
      <rect x="40" y="40" width="280" height="280" rx="36"/>
    </clipPath>
    <style>
      .brand { font-family: Inter, "Segoe UI", Arial, sans-serif; font-weight: 700; letter-spacing: 1.5px; }
    </style>
  </defs>

  <!-- ICON -->
  <g>
    <rect x="40" y="40" width="280" height="280" rx="36" fill="#0B4FB3"/>
    <g clip-path="url(#clipBox)">
      <rect x="40" y="40" width="280" height="280" fill="url(#binText)"/>
    </g>
    <path d="M240 40 L320 40 L320 120 Z" fill="#FFFFFF"/>
    <path d="M228 40 L320 132 L320 168 L180 40 Z" fill="#FFFFFF" opacity="0.14"/>
  </g>

  <!-- WORDMARK (tight gap) -->
  <text x="650" y="190" text-anchor="middle" class="brand" font-size="96" fill="#0B4FB3">EDGESTREAM</text>
  <text x="650" y="300" text-anchor="middle" class="brand" font-size="96" fill="#2F2F2F">HUB</text>
</svg>